<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/><meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/><meta name="theme-color" content="#000000"/>
<link rel="icon" type="image/png" href="/favicon.png"/><link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png"/><link rel="manifest" href="/manifest.webmanifest"/>
<title>卡牌传奇 Card Legend Proto</title>
<style>
html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
/* PWA/iOS 独立模式：高度跟随真实可视区（dvh/svh/-webkit-fill-available 逐级回退），不依赖 screen.height */
html{height:-webkit-fill-available;height:100svh;height:100dvh}body{position:fixed;inset:0;min-height:-webkit-fill-available;height:100%}
#game{position:fixed;inset:0;background:#000;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
body.mobile #game{padding:0}
body.mobile{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#rotate{display:none;position:fixed;inset:0;z-index:9999;background:rgba(10,6,2,.96);color:#ffe8a0;font-family:sans-serif;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
#rotate.show{display:flex}#rotate .phone{font-size:72px;animation:rot 1.8s ease-in-out infinite}
#rotate .t1{font-size:24px;font-weight:bold;margin-top:18px}#rotate .t2{margin-top:14px;padding:10px 22px;border:2px solid #d4a64a;border-radius:8px;font-size:17px}
#rotate .t3{margin-top:16px;font-size:13px;color:#aaa}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
</style>
</head><body><div id="game"><div id="boot" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#d4a64a;font:16px sans-serif">卡牌传奇 载入中…</div></div><script type="module" src="/src/main.ts"></script></body></html>
